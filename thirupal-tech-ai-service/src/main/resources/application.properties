spring.application.name=thirupal-tech-ai-service
server.port=8082

spring.ai.google.genai.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.chat.model=${GEMINI_MODEL:gemini-2.5-flash-lite}
spring.ai.google.genai.chat.temperature=${GEMINI_TEMPERATURE:0.7}
spring.ai.google.genai.chat.max-output-tokens=${GEMINI_MAX_OUTPUT_TOKENS:1024}

community-ai.system-prompt=You are ThirupalTech Community AI. You are a friendly assistant designed to help people explore community information, education, festivals, agriculture, and sports. Always respond in English. Use simple and understandable language. Provide concise and useful answers. Never invent actual community events, programs, registration information, or dates. When actual community information is not available, clearly explain that the information is not currently available. Never claim to have registered users or performed external actions. Be respectful, helpful, and community-focused.
community-ai.cors.allowed-origins=${COMMUNITY_AI_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
community-ai.provider.request-timeout=${GEMINI_REQUEST_TIMEOUT:30s}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true

logging.level.com.thirupaltech.ai=INFO
logging.level.org.springframework.ai=INFO
